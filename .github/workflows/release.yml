name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test packaging and updating
        run: python3 -m unittest discover -s tests -v
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py pack --tag "$RELEASE_TAG" --output dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/work1z-release.json"; then
            python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Release is already public; publish a new version instead")' "$RUNNER_TEMP/work1z-release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Work1z $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "dist/work1z-plugin-$RELEASE_TAG.zip" "dist/work1z-plugin-$RELEASE_TAG.zip.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
